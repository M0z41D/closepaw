name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: closepaw
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            export KEYSTORE_PATH="${{ github.workspace }}/release.keystore"
            ./gradlew :app:assembleRelease
          else
            echo "Secrets keystore tidak ditemukan, build release tanpa custom keystore..."
            ./gradlew :app:assembleRelease || ./gradlew :app:assembleDebug
          fi

      - name: Simpan APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: closepaw-app
          path: app/build/outputs/apk/**/*.apk

      - name: Publikasikan ke GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M%S')"
          fi

          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -n "$APK_PATH" ]; then
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "Release $TAG_NAME" \
              --generate-notes || true
          fi
